# 임시 정답(weak label) 선언 — 규칙 플래그를 확률로 합치는 방법은 이 파일 한 곳에만 둔다.
# p_tier: "이 등급 규칙 하나가 걸렸을 때 위반으로 확정될 확률"의 초기 추정. 윤경팀 판정이 쌓이면 p_rule(규칙별 경험 정밀도)로 덮어쓴다.
# 묶음(cluster)은 규칙 카탈로그(rules/catalog.yaml)의 cluster 필드가 진실(2026-11-06, 여기서 옮김). 묶음 안에서는 한 번만(max), 묶음 사이는 noisy-OR: prob = 1 - (1-prior)·Π(1-p_c)
version: 1
changelog:
  - {version: 1, date: 2026-11-06, change: "clusters 표를 rules/catalog.yaml의 cluster 필드로 이동. 값 변화 없음"}
  - {version: 1, date: 2026-11-01, change: "초기값 p_v 0.6 / p_a 0.2 / prior 0.02, 군집 10개. 판정 0건 상태의 선언값"}
prior: 0.02
p_tier: {violation: 0.6, advisory: 0.2}
p_rule: {}          # 예) R16_amount_outlier: 0.08  ← reviews에서 계산된 정밀도(n>=20)만 적는다. 경로: docs/MODEL.md
validation:
  planted_min_mean: 0.5
  planted_over_normal_min: 3.0
  max_single_rule_share: 0.5
