[scripts]
# data/ is gitignored: raw Excel inputs and the DuckDB warehouse built from them (load.py → synth.py → run_rules.py).
copy = ["data/raw", "data/warehouse.duckdb"]
setup = "python3 -m venv .venv && .venv/bin/pip install -r requirements.txt && pnpm --dir web install --frozen-lockfile"

# Run = the React review app (web/, Vite dev server). The Streamlit screens are frozen for demo use:
#   .venv/bin/streamlit run app/Home.py
[scripts.run.app]
command = "pnpm --dir web exec vite --host 127.0.0.1 --port $OCTAVE_PORT --strictPort"

[[scripts.check]]
name = "unit"
command = "cp data/warehouse.duckdb /tmp/royal_test.duckdb && ROYAL_DB=/tmp/royal_test.duckdb .venv/bin/python -m pytest -q tests"
description = "A service-layer or precedents test fails: list/evidence/context/review/precedent functions no longer behave as pinned down (needs data/warehouse.duckdb with flags and precedents)."

[[scripts.check]]
name = "rules"
command = "cp data/warehouse.duckdb /tmp/royal_rules.duckdb && ROYAL_DB=/tmp/royal_rules.duckdb .venv/bin/python -I scripts/run_rules.py | grep -q 'OVERALL recall 114/114'"
description = "The rule engine no longer catches every planted violation in the synthetic ground truth: a rule or threshold change regressed recall."

[[scripts.check]]
name = "features"
command = "cp data/warehouse.duckdb /tmp/royal_feat.duckdb && ROYAL_DB=/tmp/royal_feat.duckdb .venv/bin/python -I scripts/build_features.py --quiet && ROYAL_DB=/tmp/royal_feat.duckdb .venv/bin/python -I scripts/validate_features.py"
description = "The feature table failed a validation check: schema/catalog mismatch, a rule-derived column, point-in-time leakage (static, dual-strategy, or perturbation), undeclared redundancy, a direction expectation contradicted by the weak signal, or a non-reproducible rebuild."

[[scripts.check]]
name = "model"
command = "cp data/warehouse.duckdb /tmp/royal_model.duckdb && ROYAL_DB=/tmp/royal_model.duckdb .venv/bin/python -I scripts/train.py --label-source weak --out /tmp/royal_models | grep -qE 'chosen: (baseline|logistic|xgb|hgb)'"
description = "Model training failed or produced no chosen model: the feature matrix, weak labels, time split, or one of the candidate scorers broke."
