services:
  db:
    image: postgres:17-alpine
    container_name: ri_db
    environment:
      POSTGRES_PASSWORD: x
      POSTGRES_DB: ri
      TZ: Asia/Seoul
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ri"]
      interval: 2s
      timeout: 2s
      retries: 30
    # No volume on purpose: the database is rebuilt from data/raw by scripts/bootstrap_db.py (≈1 min).
