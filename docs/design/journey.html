<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>거래 한 건의 이야기 — 카드가 7번 변한다</title>
<style>
  :root{--bg:#eef1f2;--card:#fff;--ink:#14181a;--muted:#6b787c;--der:#dfe7f5;--der-ink:#2b4a86;--rec:#f6ead2;--rec-ink:#8a5a12;--red:#b3261e;--redbg:#fde4e3;--grey:#e6eaec}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Pretendard Variable",-apple-system,sans-serif;font-size:14px;line-height:1.45}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 32px 40px}
  .top{display:flex;align-items:baseline;gap:14px;color:var(--muted)}
  .top h1{margin:0;font-size:18px;color:var(--ink)}
  .scene{display:grid;grid-template-columns:1fr 440px;gap:22px;margin-top:18px;min-height:560px;align-items:start}
  .story{background:var(--card);border-radius:18px;padding:22px 26px;min-height:560px;display:flex;flex-direction:column}
  .who{display:flex;align-items:center;gap:10px;font-size:15px}
  .who .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:var(--grey)}
  .who .ic.h{background:var(--rec)} .who .ic.m{background:var(--der)}
  .who b{font-weight:700}
  .stageArea{flex:1;display:grid;place-items:center;position:relative;padding:18px 0}
  .card{width:380px;background:#fff;border-radius:16px;box-shadow:0 2px 6px rgba(0,0,0,.08),0 12px 30px rgba(0,0,0,.08);padding:18px 20px;position:relative;transition:transform .5s}
  .card .amt{font-size:26px;font-weight:700;letter-spacing:-.01em}
  .card .meta{color:var(--muted);margin-top:2px}
  .card .id{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted);margin-top:10px;opacity:0;transition:opacity .6s}
  .card .id.on{opacity:1}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;min-height:0}
  .tag{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--redbg);color:var(--red);font-weight:600;opacity:0;transform:translateY(6px);animation:pop .4s forwards}
  .tag.g{background:var(--grey);color:var(--muted)}
  @keyframes pop{to{opacity:1;transform:none}}
  .stamp{position:absolute;right:16px;top:14px;border:3px solid var(--red);color:var(--red);font-weight:800;font-size:18px;padding:4px 10px;border-radius:8px;transform:rotate(-12deg) scale(1.6);opacity:0;animation:stamp .5s .3s forwards}
  .stamp.blue{border-color:var(--der-ink);color:var(--der-ink)}
  @keyframes stamp{to{opacity:1;transform:rotate(-12deg) scale(1)}}
  .side{display:flex;align-items:center;gap:14px;margin-left:18px}
  .scale{width:180px;height:90px;position:relative}
  .scale .bar{position:absolute;left:10px;right:10px;top:40px;height:6px;border-radius:3px;background:var(--grey)}
  .scale .me{position:absolute;top:28px;width:3px;height:30px;background:var(--red);border-radius:2px;animation:slide 1s ease forwards}
  .scale .lab{position:absolute;font-size:11px;color:var(--muted);top:58px}
  @keyframes slide{from{left:30px}to{left:150px}}
  .pile{position:relative;width:420px;height:230px;margin-top:10px}
  .pile .sheet{position:absolute;left:50%;width:300px;height:56px;border-radius:10px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1);transform:translateX(-50%)}
  .pile .cnt{position:absolute;right:0;bottom:6px;color:var(--muted);font-size:12px}
  .btnrow{display:flex;gap:8px;margin-top:14px}
  .btn{padding:8px 16px;border-radius:9px;background:#fff;border:1.5px solid #d7dde0;font-weight:600}
  .btn.v{background:var(--red);color:#fff;border-color:var(--red);animation:press .6s .4s}
  @keyframes press{50%{transform:scale(.92)}}
  .cursor{position:absolute;font-size:22px;animation:move 1s .1s forwards;left:40%;top:70%}
  @keyframes move{to{left:46%;top:84%}}
  .months{display:flex;gap:30px;align-items:flex-end;margin-top:8px}
  .month{text-align:center}
  .month .lab{font-size:12px;color:var(--muted);margin-bottom:6px}
  .month .col{display:flex;flex-direction:column;gap:4px}
  .mini{width:170px;height:26px;border-radius:7px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08);font-size:11px;display:flex;align-items:center;padding:0 8px;color:var(--muted)}
  .mini.me{background:var(--redbg);color:var(--red);font-weight:700}
  .arrowBig{font-size:28px;color:var(--rec-ink);align-self:center;animation:pop .5s .6s forwards;opacity:0}
  .cap{color:var(--muted);font-size:13px;margin-top:8px}
  .cap b{color:var(--ink)}
  .erd{background:var(--card);border-radius:18px;padding:18px 20px;position:sticky;top:20px}
  .erd h3{margin:0 0 4px;font-size:12px;color:var(--muted);font-weight:600}
  .erd .hint{font-size:12px;color:var(--muted);margin-bottom:12px}
  .chain{display:flex;flex-direction:column;align-items:center;gap:0;position:relative}
  .node{width:100%;border-radius:10px;padding:8px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;opacity:.25;transition:all .4s;border:2px solid transparent}
  .node.der{background:var(--der);color:var(--der-ink)} .node.rec{background:var(--rec);color:var(--rec-ink)} .node.src{background:var(--grey);color:#4a555a}
  .node.on{opacity:1} .node.now{opacity:1;border-color:var(--ink);transform:scale(1.03)}
  .node .nm{font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700}
  .node .rows{font-size:11px;background:rgba(0,0,0,.08);border-radius:999px;padding:1px 8px;white-space:nowrap}
  .node .what{grid-column:1/3;font-size:11px;opacity:.85}
  .link{height:16px;width:2px;background:#cfd6d9;position:relative}
  .link.on{background:var(--der-ink)}
  .link.back{background:none;height:0;width:0}
  .back path{fill:none;stroke:var(--rec-ink);stroke-width:2.5;stroke-dasharray:6 6;animation:dash 1s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-12}}
  .nav{display:flex;align-items:center;gap:10px;margin-top:16px}
  .dots{display:flex;gap:6px;flex:1;justify-content:center}
  .dot{width:10px;height:10px;border-radius:50%;background:#cfd6d9;cursor:pointer}
  .dot.on{background:var(--ink);transform:scale(1.25)} .dot.seen{background:#8a949a}
  button{border:0;background:var(--card);padding:7px 14px;border-radius:999px;font:inherit;cursor:pointer}
  button.pri{background:var(--ink);color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>거래 한 건의 이야기</h1><span>카드가 7번 변한다 · 오른쪽은 그때마다 남는 기록</span></div>
  <div class="scene">
    <div class="story" id="story"></div>
    <div class="erd">
      <h3>남는 기록 (ERD 핵심 8개)</h3>
      <div class="hint">파랑 = 기계가 만든 것 · 노랑 = 사람이 만든 것. 거래 1건이 만든 행 수.</div>
      <div class="chain" id="chain"></div>
    </div>
  </div>
  <div class="nav"><button id="prev">← 이전</button><div class="dots" id="dots"></div><button id="play" class="pri">▶ 자동 재생</button><button id="next">다음 →</button></div>
</div>
<script>
const CARD=(extra='',stamp='')=>`<div class="card">${stamp}<div class="amt">323,657원</div><div class="meta">맥주플랜트 · 일반주점 · 2025-03-10 (월) 22:56 · 가***5</div><div class="id" id="txid">거래번호 ‑20663416288620009 (내용으로 만든 번호 · 다시 올려도 같음)</div>${extra}</div>`;
const TAGS=`<div class="tags"><span class="tag" style="animation-delay:.1s">집 근처에서 사용</span><span class="tag" style="animation-delay:.3s">제한 업종</span><span class="tag" style="animation-delay:.5s">업종–계정 불일치</span><span class="tag" style="animation-delay:.7s">승인자 집 근처</span><span class="tag g" style="animation-delay:.9s">동료 중앙값의 5배</span></div>`;
const S=[
 {who:['m','📥','<b>3월 엑셀</b>이 올라온다'],body:()=>CARD(),after:()=>setTimeout(()=>document.getElementById('txid')?.classList.add('on'),500),
  cap:'엑셀 한 줄이 카드 한 장이 된다. 번호는 줄 순서가 아니라 <b>내용</b>으로 만들어, 다음 달 다시 올려도 같은 번호.',erd:['transactions'],rows:{transactions:'1행'}},
 {who:['m','🔍','<b>규칙 21개</b>가 카드를 검사한다'],body:()=>CARD(TAGS),cap:'5개에 걸렸다. 빨강은 규정 위반, 회색은 참고. 꼬리표마다 <b>어느 규정 몇 조</b>인지가 붙어 있다.',erd:['flags'],rows:{flags:'5행 (꼬리표 1개 = 1행)'}},
 {who:['m','⚖️','<b>평소와 비교</b>한다'],body:()=>CARD(TAGS)+`<div class="side"><div class="scale"><div class="bar"></div><div class="me"></div><span class="lab" style="left:0">본인 평소 27,404원</span><span class="lab" style="right:0">이 건 <b>11.8배</b></span></div></div>`,
  cap:'이 사람의 과거 12건, 같은 업종 동료 51건과 비교. 전부 <b>이 거래 이전</b> 데이터만 쓴다.',erd:['tx_features'],rows:{tx_features:'1행 (숫자 35개)'}},
 {who:['m','🎯','<b>모델</b>이 순위를 매긴다'],body:()=>CARD(TAGS,'<div class="stamp blue">상위 0.1%</div>'),cap:'모델마다 점수를 따로 남긴다. 기준선 1.00, 학습 모델 0.08. 화면엔 <b>순위</b>로 보여 모델을 바꿔도 뜻이 같다.',erd:['tx_scores'],rows:{tx_scores:'2행 (모델 수만큼)'}},
 {who:['m','📚','<b>3월 검토 목록</b>에 들어간다'],body:()=>`<div class="pile">${[5,4,3,2,1].map(i=>`<div class="sheet" style="top:${40+i*22}px;opacity:${.35+i*.1}"></div>`).join('')}<div class="sheet" style="top:30px;background:var(--redbg);border:2px solid var(--red);display:flex;align-items:center;padding:0 14px;font-weight:700;color:var(--red);transform:translateX(-50%) translateY(-10px)">맥주플랜트 323,657원 · 1순위</div><div class="cnt">7,521건 중 맨 위</div></div>`,
  cap:'규칙에 걸린 6,819건, 모델이 고른 20건, 무작위 682건이 한 목록. 이 카드는 <b>규칙 출처 1순위</b>.',erd:['queue_items'],rows:{queue_items:'1행 (출처 · 순위)'}},
 {who:['h','🧑‍💼','<b>심사자</b>가 판정한다'],body:()=>CARD(TAGS,'<div class="stamp">위반</div>')+`<div class="btnrow"><span class="btn v">위반</span><span class="btn">아님</span><span class="btn">보류</span></div><span class="cursor">👆</span>`,
  cap:'사람이 처음 등장한다. "위반 · 환급 요청"을 누르면 <b>꼬리표 5개마다 1행</b>. 덮어쓰지 않고 쌓는다.',erd:['reviews'],rows:{reviews:'5행 (사람)'}},
 {who:['h','🔁','<b>다음 달</b>, 판정이 정답이 된다'],body:()=>`<div class="months"><div class="month"><div class="lab">3월 목록 (모델 v1)</div><div class="col"><div class="mini me">맥주플랜트 · 위반 ✓</div><div class="mini">아사칸정자점</div><div class="mini">상현골프클럽</div><div class="mini">…</div></div></div><div class="arrowBig">⟶</div><div class="month"><div class="lab">4월 목록 (모델 v2 · 그림자)</div><div class="col"><div class="mini me">비슷한 패턴이 위로</div><div class="mini">…</div><div class="mini">…</div><div class="mini">…</div></div></div></div>`,
  cap:'위반 판정이 <b>정답(라벨)</b>이 되어 모델이 다시 배운다. 새 모델은 그림자로 점수만 내다가, 실제 판정과 더 맞으면 사람이 승격.',erd:['labels','model_versions','model_bindings'],rows:{labels:'5행',model_versions:'1행',model_bindings:'1행 (그림자)'},loop:true},
];
const CHAIN=[['transactions','src','거래 카드'],['flags','der','규칙 꼬리표'],['tx_features','der','평소 대비 숫자'],['tx_scores','der','모델 점수·순위'],['queue_items','der','검토 목록 자리'],['reviews','rec','판정 (사람)'],['labels','der','정답'],['model_versions','der','다시 배운 모델'],['model_bindings','rec','어느 모델을 쓸지 (사람)']];
const chain=document.getElementById('chain');
CHAIN.forEach(([n,k,w],i)=>{if(i){const l=document.createElement('div');l.className='link';l.dataset.to=n;chain.appendChild(l)}const d=document.createElement('div');d.className=`node ${k}`;d.dataset.n=n;d.innerHTML=`<span class="nm">${n}</span><span class="rows" data-r="${n}"></span><span class="what">${w}</span>`;chain.appendChild(d)});
const back=document.createElement('div');back.className='link back';back.innerHTML='<svg><path d="M20,536 C60,536 60,0 20,0"/></svg>';back.style.display='none';chain.appendChild(back);
const story=document.getElementById('story'),dots=document.getElementById('dots');
S.forEach((_,i)=>{const d=document.createElement('div');d.className='dot';d.onclick=()=>show(i);dots.appendChild(d)});
let cur=0,timer=null;
function show(i){cur=(i+S.length)%S.length;const s=S[cur];
  [...dots.children].forEach((d,j)=>d.className='dot'+(j===cur?' on':j<cur?' seen':''));
  story.innerHTML=`<div class="who"><span class="ic ${s.who[0]}">${s.who[1]}</span><span>${s.who[2]}</span></div><div class="stageArea">${s.body()}</div><div class="cap">${cur+1} / 7 · ${s.cap}<br><span style="font-size:12px">남는 기록: ${s.erd.map(e=>`<code>${e}</code>`).join(' · ')}</span></div>`;
  s.after&&s.after();
  const seen=new Set(S.slice(0,cur+1).flatMap(x=>x.erd));
  document.querySelectorAll('.node').forEach(n=>{const k=n.dataset.n;n.classList.toggle('on',seen.has(k));n.classList.toggle('now',s.erd.includes(k));const r=n.querySelector('.rows');r.textContent=S.slice(0,cur+1).map(x=>x.rows[k]).filter(Boolean).pop()||''});
  document.querySelectorAll('.link:not(.back)').forEach(l=>l.classList.toggle('on',seen.has(l.dataset.to)));
  back.style.display=s.loop?'block':'none';
  if(s.loop){ // dashed return arrow: model_bindings → tx_scores (the serving model decides which scores the next queue reads)
    const a=document.querySelector('[data-n="model_bindings"]').getBoundingClientRect(),b=document.querySelector('[data-n="tx_scores"]').getBoundingClientRect(),c=chain.getBoundingClientRect();
    const x=a.right-c.left+4,y1=a.top-c.top+a.height/2,y2=b.top-c.top+b.height/2;
    back.innerHTML=`<svg style="position:absolute;left:0;top:0;width:${c.width+40}px;height:${c.height}px;overflow:visible"><path d="M${x},${y1} C${x+70},${y1} ${x+70},${y2} ${x},${y2}"/><text x="${x+74}" y="${(y1+y2)/2}" font-size="11" fill="#8a5a12">다음 달 순서</text></svg>`;
    back.style.position='absolute';back.style.inset='0';back.style.pointerEvents='none';
  }
}
document.getElementById('prev').onclick=()=>show(cur-1);document.getElementById('next').onclick=()=>show(cur+1);
const play=document.getElementById('play');play.onclick=()=>{if(timer){clearInterval(timer);timer=null;play.textContent='▶ 자동 재생';return}play.textContent='❚❚ 멈춤';timer=setInterval(()=>show(cur+1),3200)};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(cur+1);if(e.key==='ArrowLeft')show(cur-1)});
show(0);
</script>
</body>
</html>
