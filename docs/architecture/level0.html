<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>아키텍처 L0 — 단계별</title>
<style>
 body{font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;background:#fafafa;color:#222;margin:0;padding:28px}
 h1{font-size:20px;margin:0 0 4px} .sub{color:#666;font-size:13px;margin-bottom:14px}
 .bar{max-width:1180px;margin:0 auto 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
 .bar button{border:1px solid #cbd5e1;background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px}
 .bar button.on{background:#1e293b;color:#fff;border-color:#1e293b}
 svg{width:100%;max-width:1180px;display:block;margin:0 auto;background:#fff;border:1px solid #e5e5e5;border-radius:10px}
 [data-step]{opacity:0;transition:opacity .25s} [data-step].show{opacity:1}
 .cap{max-width:1180px;margin:14px auto 0;font-size:14px;line-height:1.7;background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:14px 18px;min-height:60px}
</style></head><body>
<h1>레벨 0 — 상자를 하나씩</h1>
<div class="sub">← → 키 또는 버튼으로 한 단계씩. 각 단계는 상자 하나(또는 선 하나)만 추가됩니다.</div>
<div class="bar" id="bar"></div>
<svg viewBox="0 0 1180 520" font-size="13">
 <defs>
  <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  <marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
 </defs>
 <g data-step="1" font-weight="600"><rect x="30" y="120" width="150" height="70" rx="10" fill="#dbeafe" stroke="#60a5fa"/><text x="105" y="150" text-anchor="middle">① 적재</text><text x="105" y="170" text-anchor="middle" font-weight="400" fill="#475569">엑셀 → 표준 테이블</text></g>
 <g data-step="2" font-weight="600"><line x1="180" y1="155" x2="218" y2="155" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="220" y="120" width="150" height="70" rx="10" fill="#dbeafe" stroke="#60a5fa"/><text x="295" y="150" text-anchor="middle">② 규칙 엔진</text><text x="295" y="170" text-anchor="middle" font-weight="400" fill="#475569">21개 규칙, 근거 문장</text></g>
 <g data-step="3" font-weight="600"><line x1="370" y1="155" x2="408" y2="155" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="410" y="120" width="150" height="70" rx="10" fill="#dbeafe" stroke="#60a5fa"/><text x="485" y="150" text-anchor="middle">③ 피처 · 라벨</text><text x="485" y="170" text-anchor="middle" font-weight="400" fill="#475569">평소 대비 숫자, 임시 정답</text></g>
 <g data-step="4" font-weight="600"><line x1="560" y1="155" x2="598" y2="155" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="600" y="120" width="150" height="70" rx="10" fill="#dbeafe" stroke="#60a5fa"/><text x="675" y="150" text-anchor="middle">④ 점수 모델</text><text x="675" y="170" text-anchor="middle" font-weight="400" fill="#475569">순서만 정함</text></g>
 <g data-step="5" font-weight="600"><line x1="750" y1="155" x2="788" y2="155" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="790" y="120" width="150" height="70" rx="10" fill="#dbeafe" stroke="#60a5fa"/><text x="865" y="150" text-anchor="middle">⑤ 검토 큐</text><text x="865" y="170" text-anchor="middle" font-weight="400" fill="#475569">걸린 것 + 무작위 표본</text></g>
 <g data-step="6" font-weight="600"><line x1="940" y1="155" x2="978" y2="155" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="980" y="120" width="170" height="70" rx="10" fill="#fef3c7" stroke="#f59e0b"/><text x="1065" y="150" text-anchor="middle">⑥ 사람 판정</text><text x="1065" y="170" text-anchor="middle" font-weight="400" fill="#475569">위반 / 아님 / 보류</text></g>
 <g data-step="7"><rect x="30" y="230" width="1120" height="46" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="590" y="258" text-anchor="middle" fill="#334155">DuckDB 한 파일 — 모든 상자가 여기서 읽고 여기에 씀</text></g>
 <g data-step="8" font-weight="600"><rect x="220" y="330" width="150" height="56" rx="10" fill="#fef3c7" stroke="#f59e0b"/><text x="295" y="353" text-anchor="middle">임계치 확정</text><text x="295" y="372" text-anchor="middle" font-weight="400" fill="#475569">윤경팀이 숫자 결정</text><line x1="295" y1="330" x2="295" y2="192" stroke="#f59e0b" stroke-width="2" marker-end="url(#a)"/></g>
 <g data-step="9" font-weight="600"><rect x="560" y="330" width="190" height="56" rx="10" fill="#fef3c7" stroke="#f59e0b"/><text x="655" y="353" text-anchor="middle">새 규칙 승인</text><text x="655" y="372" text-anchor="middle" font-weight="400" fill="#475569">발굴 후보 → 사람이 승격</text><path d="M655,330 L655,300 L295,300 L295,192" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#a)"/></g>
 <g data-step="10" font-weight="600"><rect x="980" y="330" width="170" height="56" rx="10" fill="#fef3c7" stroke="#f59e0b"/><text x="1065" y="353" text-anchor="middle">과거 결과 입력</text><text x="1065" y="372" text-anchor="middle" font-weight="400" fill="#475569">윤경팀 점검 이력 → 라벨</text></g>
 <g data-step="11"><path d="M1065,190 L1065,210 L1120,210 L1120,440 L485,440 L485,192" stroke="#16a34a" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#g)"/><text x="700" y="434" fill="#15803d" font-size="12">되먹임 1: 사람 판정 → 임시 정답을 진짜 정답으로 교체</text></g>
 <g data-step="12"><path d="M1065,386 L1065,470 L470,470 L470,192" stroke="#16a34a" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#g)"/><text x="700" y="464" fill="#15803d" font-size="12">되먹임 2: 과거 점검 결과 → 라벨 (시연용 → 운영용)</text></g>
 <g data-step="13"><path d="M865,190 L865,215 L750,215 L750,300 L655,300 L655,330" stroke="#16a34a" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#g)"/><text x="760" y="226" fill="#15803d" font-size="12">되먹임 3: 무작위 표본·변형에서 놓친 것 → 새 규칙 후보</text></g>
</svg>
<div class="cap" id="cap"></div>
<script>
const caps = {
1:"<b>① 적재.</b> 카드사 엑셀과 출입기록 엑셀을 올리면 금액을 숫자로, 취소를 제외하고, 계정을 규정표에 맞춰 표준 테이블로 만듭니다. 원본은 건드리지 않고, 다시 올리면 같은 결과가 나옵니다. (scripts/load.py — 완료)",
2:"<b>② 규칙 엔진.</b> 표준 테이블의 거래 전부에 규칙 21개를 돌립니다. 걸린 거래마다 '어떤 규칙, 어떤 값, 함께 볼 거래, 근거 규정'이 붙습니다. 임계치는 카탈로그 한 파일에 있고 사람이 바꿉니다. (rules/, scripts/run_rules.py — 완료)",
3:"<b>③ 피처 · 라벨.</b> 거래마다 '이 사람 평소의 몇 배, 혼자만 가는 가게인가' 같은 숫자 열을 만들고(피처), 규칙 19개의 투표로 '아마 위반일 확률'을 임시 정답으로 만듭니다(라벨). 규칙 결과 자체는 피처에 넣지 않습니다. (다음 작업)",
4:"<b>④ 점수 모델.</b> 피처와 라벨로 학습해 거래마다 0~1 점수를 냅니다. 판정은 하지 않고 순서만 정합니다. 항상 '단순 정렬보다 나은가'를 함께 보여줍니다. (다음 작업)",
5:"<b>⑤ 검토 큐.</b> 사람이 볼 목록. 걸린 거래를 점수순으로, 거기에 안 걸린 거래의 무작위 표본을 섞습니다. 각 건에 '왜 올라왔나'가 기록됩니다. (무작위 표본은 다음 작업)",
6:"<b>⑥ 사람 판정.</b> 한 건씩 보고 위반 / 아님 / 보류. 근거 문장, 규정 인용, 비슷한 징계사례, 그날 동선이 순서대로 보입니다. 결정은 이력으로 남습니다. (app/ — 완료)",
7:"<b>저장소.</b> 위 상자 전부가 DuckDB 파일 하나를 읽고 씁니다. 여러 명이 동시에 쓰는 시점에 검토 기록만 PostgreSQL로 옮깁니다.",
8:"<b>사람 개입 1 — 임계치 확정.</b> '분할은 60분 안에 2건' 같은 숫자는 규정이 아니라 도구 설정이라 윤경팀이 정합니다. 값별로 몇 건 걸리는지 표가 있습니다.",
9:"<b>사람 개입 2 — 새 규칙 승인.</b> 기계가 제안한 규칙 후보는 과거 데이터에 돌려 본 결과와 함께 사람 앞에 오고, 승인해야 규칙 엔진에 들어갑니다.",
10:"<b>사람 개입 3 — 과거 결과 입력.</b> 윤경팀에 수년치 점검 결과가 있으면 그 엑셀을 올려 정답으로 씁니다. 이 순간 시연용 모델이 운영용이 됩니다.",
11:"<b>되먹임 1.</b> 사람 판정이 쌓이면 임시 정답(규칙 투표)을 진짜 정답으로 바꿔 모델을 다시 학습합니다. 같은 스크립트, 인자 하나만 다릅니다.",
12:"<b>되먹임 2.</b> 과거 점검 결과도 같은 길로 라벨이 됩니다.",
13:"<b>되먹임 3.</b> 무작위 표본에서 발견된 위반과 범인 관점 변형에서 못 잡은 것이 새 규칙 후보가 되어 사람 승인(⑨)으로 갑니다. 규칙은 기계가 혼자 바꾸지 않습니다."};
const N = 13; let step = +(location.hash.slice(1)) || 1;
const bar = document.getElementById('bar');
for (let i = 1; i <= N; i++) { const b = document.createElement('button'); b.textContent = i; b.onclick = () => go(i); bar.appendChild(b); }
function go(s) { step = Math.max(1, Math.min(N, s)); location.hash = step;
  document.querySelectorAll('[data-step]').forEach(el => el.classList.toggle('show', +el.dataset.step <= step));
  [...bar.children].forEach((b, i) => b.classList.toggle('on', i + 1 === step));
  document.getElementById('cap').innerHTML = caps[step]; }
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(step + 1); if (e.key === 'ArrowLeft') go(step - 1); });
go(step);
</script></body></html>
