<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>아키텍처 L0</title>
<style>
 body{font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;background:#fafafa;color:#222;margin:0;padding:40px}
 h1{font-size:20px;margin:0 0 6px} .sub{color:#666;font-size:14px;margin-bottom:26px}
 svg{width:100%;max-width:900px;display:block;margin:0 auto;background:#fff;border:1px solid #e5e5e5;border-radius:10px}
 .note{max-width:900px;margin:18px auto 0;font-size:14px;line-height:1.7;color:#333}
</style></head><body>
<h1>레벨 0 — 한 바퀴</h1>
<div class="sub">기계가 거르고, 사람이 판정하고, 그 판정이 기계를 다시 가르친다.</div>
<svg viewBox="0 0 900 360" font-size="15">
 <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
 <g font-weight="700" text-anchor="middle">
  <rect x="40"  y="110" width="180" height="90" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="130" y="148">거래 30만 건</text><text x="130" y="172" font-weight="400" fill="#475569">엑셀 업로드</text>
  <rect x="300" y="110" width="180" height="90" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="390" y="148">기계가 거름</text><text x="390" y="172" font-weight="400" fill="#475569">규칙 + 순서 매기기</text>
  <rect x="560" y="110" width="180" height="90" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="650" y="148">사람이 판정</text><text x="650" y="172" font-weight="400" fill="#475569">몇천 건만 봄</text>
  <rect x="300" y="260" width="440" height="70" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="520" y="290">판정 결과가 쌓임</text><text x="520" y="312" font-weight="400" fill="#475569">→ 순서가 좋아지고, 놓친 유형은 새 규칙이 됨</text>
 </g>
 <g stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)">
  <line x1="220" y1="155" x2="298" y2="155"/>
  <line x1="480" y1="155" x2="558" y2="155"/>
  <path d="M650,200 L650,258"/>
  <path d="M300,295 L250,295 L250,180 L298,180"/>
 </g>
 <text x="760" y="60" font-size="13" fill="#64748b" text-anchor="end">파랑 = 자동 · 노랑 = 사람 · 초록 = 되먹임</text>
</svg>
<div class="note">
<b>읽는 법.</b> 왼쪽에서 오른쪽으로 한 번 흐르고, 아래 초록 상자를 거쳐 다시 "기계가 거름"으로 돌아옵니다. 이 바퀴가 기간마다 돕니다.<br>
<b>사람이 하는 것은 두 가지뿐.</b> 판정을 누르는 것, 그리고 기계가 제안한 새 규칙이나 숫자를 승인하는 것.<br>
<b>기계 혼자 바꾸는 것.</b> 거래를 보여주는 순서뿐. 규칙과 숫자는 사람 승인 없이 바뀌지 않습니다.
</div>
</body></html>
